<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
<style>
:root{
  --bg:#F8FAFC;--surface:#fff;--raised:#F1F5F9;--border:#E2E8F0;--border-light:#F1F5F9;
  --text:#0F172A;--muted:#64748B;--dim:#94A3B8;
  --accent:#7C3AED;--accent-l:#F5F3FF;--accent-d:rgba(124,58,237,.12);
  --green:#059669;--green-l:#ECFDF5;
  --red:#DC2626;--red-l:#FEF2F2;
  --warm:#D97706;--warm-l:#FFFBEB;
  --blue:#2563EB;--blue-l:#EFF6FF;
  --sw:220px;--th:52px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow:hidden}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.logo{padding:14px 16px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.logo-box{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;color:#fff;font-size:13px;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}.logo-text span{color:var(--accent)}
.nav-group{padding:6px 0;border-bottom:1px solid var(--border-light)}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:4px 16px 2px}
.nav-btn{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:background .1s,color .1s}
.nav-btn:hover{background:var(--raised);color:var(--text)}
.nav-btn.active{background:var(--accent-l);color:var(--accent)}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;min-width:18px;text-align:center}
.nav-badge.warn{background:var(--warm)}.nav-badge.red{background:var(--red)}.nav-badge.gr{background:var(--green)}
.sidebar-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.plan-chip{margin-left:auto;font-size:10px;font-weight:700;background:var(--accent-l);color:var(--accent);padding:2px 7px;border-radius:10px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--th);border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;flex:1}
.topbar-sub{font-size:12px;color:var(--muted)}
.page{flex:1;overflow-y:auto;padding:20px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .1s}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:#6D28D9}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--raised)}
.btn-ghost{background:transparent;color:var(--muted);border-color:transparent}.btn-ghost:hover{background:var(--raised);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:12px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;flex-shrink:0}
.av-p{background:var(--accent)}.av-g{background:var(--green)}.av-b{background:var(--blue)}.av-w{background:var(--warm)}.av-m{background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-size:24px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stat-sub{font-size:12px;color:var(--green)}.stat-sub.neg{color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px}
.ch{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.ct{font-size:13px;font-weight:600}
.cb{padding:14px 16px}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tt{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.tt-title{font-size:13px;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--raised);text-transform:uppercase;letter-spacing:.05em}
tbody tr{border-bottom:1px solid var(--border-light)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px 12px;vertical-align:middle}
tbody tr:hover{background:var(--raised)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-l);color:var(--green)}
.br{background:var(--red-l);color:var(--red)}
.bw{background:var(--warm-l);color:var(--warm)}
.ba{background:var(--accent-l);color:var(--accent)}
.bb{background:var(--blue-l);color:var(--blue)}
.bz{background:var(--raised);color:var(--muted)}
.filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fi{flex:1;min-width:160px;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--text);outline:none}
.fi:focus{border-color:var(--accent)}
select.fi{cursor:pointer}
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:6px;border:1px solid var(--border);background:var(--surface)}
.adot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.adot.r{background:var(--red)}.adot.w{background:var(--warm)}.adot.g{background:var(--green)}.adot.b{background:var(--blue)}
.a-title{font-size:13px;font-weight:500}.a-sub{font-size:11px;color:var(--muted)}
.pw{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
.pb{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.pb.g{background:var(--green)}.pb.w{background:var(--warm)}.pb.b{background:var(--blue)}
.tabs{display:flex;gap:2px;background:var(--raised);border-radius:8px;padding:3px;width:fit-content;margin-bottom:16px}
.tab{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);border:none;background:none}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px}
.cal-day{min-height:68px;padding:4px;border:1px solid var(--border-light);border-radius:4px;background:var(--surface)}
.cal-dn{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:3px}
.cal-day.today{border-color:var(--accent)}.cal-day.today .cal-dn{color:var(--accent);font-weight:700}
.cal-ev{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-l);color:var(--accent);font-weight:500}
.cal-ev.g{background:var(--green-l);color:var(--green)}.cal-ev.b{background:var(--blue-l);color:var(--blue)}.cal-ev.w{background:var(--warm-l);color:var(--warm)}.cal-ev.r{background:var(--red-l);color:var(--red)}
.bar-chart{display:flex;gap:8px;align-items:flex-end;height:90px;padding-top:8px}
.bw2{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:4px}
.bar.g{background:var(--green)}.bar.w{background:var(--warm)}.bar.b{background:var(--blue)}
.bl{font-size:10px;color:var(--muted);text-align:center}.bv{font-size:10px;font-weight:600;color:var(--text)}
.sp{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;margin:1px}
.sm{background:#EFF6FF;color:#2563EB}.sp2{background:#F0FDF4;color:#16A34A}.ss{background:#F0FDF4;color:#059669}.sf{background:#FFF7ED;color:#EA580C}.sa{background:#FDF4FF;color:#9333EA}.se{background:#F0F9FF;color:#0284C7}
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl-item::before{content:'';position:absolute;left:11px;top:22px;width:2px;height:calc(100% - 10px);background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--accent-l);color:var(--accent);position:relative;z-index:1}
.tl-c{flex:1;padding-top:2px}.tl-t{font-size:13px;font-weight:500}.tl-s{font-size:11px;color:var(--muted);margin-top:2px}
.chat-msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;max-height:280px;overflow-y:auto}
.chat-msg{display:flex;gap:8px}.chat-msg.u{flex-direction:row-reverse}
.bubble{max-width:75%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;background:var(--raised);color:var(--text)}
.chat-msg.u .bubble{background:var(--accent);color:#fff}
.chat-in-row{display:flex;gap:8px}
.chat-in{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:none}
.chat-in:focus{border-color:var(--accent)}
.ratt-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;background:var(--blue-l);color:var(--blue)}
.p-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
.p-dot.present{background:var(--green)}.p-dot.absent{background:var(--red)}.p-dot.late{background:var(--warm)}.p-dot.rattrapage{background:var(--blue)}
hr.div{border:none;border-top:1px solid var(--border);margin:14px 0}
@media(max-width:768px){.sidebar{display:none}.stats{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
</style>

function sBadge(s){
  if(s==='actif'||s==='paye'||s==='realise') return '<span class="badge bg">'+s+'</span>';
  if(s==='retard') return '<span class="badge bw">Retard</span>';
  if(s==='impaye') return '<span class="badge br">Impaye</span>';
  if(s==='inactif') return '<span class="badge bz">Inactif</span>';
  if(s==='planifie') return '<span class="badge bb">Planifie</span>';
  if(s==='non planifie') return '<span class="badge bw">Non planifie</span>';
  if(s==='present') return '<span class="badge bg">Present</span>';
  if(s==='absent') return '<span class="badge br">Absent</span>';
  if(s==='late') return '<span class="badge bw">Retard</span>';
  if(s==='rattrapage') return '<span class="badge bb">Rattrapage</span>';
  return '<span class="badge bz">'+s+'</span>';
}

function go(name, btn, sub){
  var p=PAGES[name];
  if(!p) return;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  else document.querySelectorAll('.nav-btn').forEach(function(b){if(b.getAttribute('onclick')&&b.getAttribute('onclick').indexOf("'"+name+"'")>-1)b.classList.add('active');});
  document.getElementById('pg-title').textContent=p.title;
  document.getElementById('pg-sub').textContent=p.sub;
  var ta=document.getElementById('pg-action');
  if(p.action){ta.textContent=p.action;ta.style.display='';}else ta.style.display='none';
  document.getElementById('page-content').innerHTML=p.html(sub);
}

function sendChat(){
  var inp=document.getElementById('chat-input');
  var msgs=document.getElementById('chat-msgs');
  if(!inp||!msgs||!inp.value.trim()) return;
  var v=inp.value.trim(); inp.value='';
  msgs.innerHTML+='<div class="chat-msg u"><div class="av av-m" style="flex-shrink:0">KA</div><div class="bubble">'+v+'</div></div>';
  setTimeout(function(){
    var replies=['Rapport genere avec succes. Voulez-vous l\'envoyer au parent ?','Analyse terminee. Voici les points cles identifies pour ce mois.','Plan de cours cree - 4 sequences pedagogiques adaptees.','Relances WhatsApp redigees pour les 3 eleves impayes.','Rattrapages identifies : 2 a planifier, 1 non justifie en urgence.'];
    var r=replies[Math.floor(Math.random()*replies.length)];
    msgs.innerHTML+='<div class="chat-msg"><div class="av av-p" style="flex-shrink:0">IA</div><div class="bubble">'+r+'</div></div>';
    msgs.scrollTop=msgs.scrollHeight;
  },700);
  msgs.scrollTop=msgs.scrollHeight;
}

function ins(t){var i=document.getElementById('chat-input');if(i){i.value=t;i.focus();}}

function simulateScan(){
  var r=document.getElementById('scan-result');
  if(r){r.style.display='block';setTimeout(function(){r.style.display='none';},3000);}
}
